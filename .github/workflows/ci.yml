name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: telematics_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/telematics_test
      API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests against Postgres
        run: pytest --cov --cov-report=term --cov-report=xml --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            junit.xml
            coverage.xml

  validate-monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config & rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.54.1 \
            check config /etc/prometheus/prometheus.yml
      - name: Grafana dashboards are valid JSON
        run: for f in monitoring/grafana/dashboards/*.json; do python -m json.tool "$f" > /dev/null; done
      - name: docker compose config is valid
        run: docker compose config --quiet

  build-and-smoke:
    needs: [lint, test, validate-monitoring]
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.sha }}
      API_KEY: ci-key
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: f1-telemetry-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: f1-telemetry-api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 120 db api prometheus

      - name: Smoke test API
        run: |
          set -euo pipefail
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/ready
          curl -fsS localhost:8000/api/v1/drivers
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/api/v1/drivers -H 'Content-Type: application/json' -d '[]')
          test "$code" = "401"
          curl -fsS -X POST localhost:8000/api/v1/sessions -H "X-API-Key: $API_KEY" \
            -H 'Content-Type: application/json' \
            -d '[{"session_key":1,"session_name":"Smoke","year":2024}]'
          curl -fsS localhost:8000/api/v1/sessions/1
          curl -fsS localhost:8000/metrics | grep -q 'f1_db_up 1.0'

      - name: Prometheus scrapes the API
        run: |
          for i in $(seq 1 20); do
            if curl -fsS 'localhost:9090/api/v1/query?query=up{job="f1-api"}' | grep -q '"1"\]'; then
              echo "scrape OK"; exit 0
            fi
            sleep 3
          done
          echo "Prometheus never scraped the API"; exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  # Optional: real data from OpenF1, run manually so CI never depends on a third-party API.
  collector-live:
    if: github.event_name == 'workflow_dispatch'
    needs: build-and-smoke
    runs-on: ubuntu-latest
    env:
      API_KEY: ci-key
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait db api
      - name: Collect one race (2 drivers, sampled telemetry)
        run: docker compose run --rm collector --year 2023 --session-name Race --max-sessions 1 --drivers 1,44 --telemetry-every 50
      - run: curl -fsS localhost:8000/api/v1/alerts | head -c 2000
      - if: always()
        run: docker compose down -v
